name: New VM

on:
  workflow_dispatch:

env:
  SSH_KEY: cache/sshkey
  INSTANCE_NAME: pega
  YC_BIN: /home/runner/yandex-cloud/bin/yc

jobs:
  new-vm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Yandex Cloud CLI
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/Jokero/yandex-cloud-cli-install-for-ci/master/install.sh \
            | bash

      - name: Check Yandex Cloud CLI
        run: |
          "$YC_BIN" -v

      - name: Authenticate in Yandex Cloud
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          test -n "$YC_SA_KEY_JSON" || {
            echo "Secret YC_SA_KEY_JSON is empty"
            exit 1
          }

          printf '%s' "$YC_SA_KEY_JSON" > "$HOME/sa-key.json"
          chmod 600 "$HOME/sa-key.json"

          python3 -m json.tool "$HOME/sa-key.json" > /dev/null || {
            echo "YC_SA_KEY_JSON is not valid JSON"
            exit 1
          }

          "$YC_BIN" config set service-account-key \
            "$HOME/sa-key.json"

          "$YC_BIN" config set cloud-id "$YC_CLOUD_ID"
          "$YC_BIN" config set folder-id "$YC_FOLDER_ID"

          "$YC_BIN" compute instance list

      - name: Show existing compute instances
        run: |
          "$YC_BIN" compute instance list

      - name: Create cache directory
        run: |
          mkdir -p cache

      - name: Generate SSH key pair
        run: |
          if [ ! -f "$SSH_KEY" ]; then
            ssh-keygen \
              -b 2048 \
              -t rsa \
              -f "$SSH_KEY" \
              -q \
              -N ""
          fi

      - name: Create Yandex Cloud compute instance
        run: |
          "$YC_BIN" compute instance create \
            --name "$INSTANCE_NAME" \
            --zone ru-central1-a \
            --public-ip \
            --create-boot-disk \
            size=30G,image-folder-id=standard-images,image-family=centos-stream-8 \
            --preemptible \
            --core-fraction 50 \
            --memory 8 \
            --ssh-key "$SSH_KEY.pub"

      - name: Show created compute instance
        run: |
          "$YC_BIN" compute instance list

      - name: Save VM configuration
        run: |
          "$YC_BIN" compute instance get "$INSTANCE_NAME" \
            > cache/vmconfig.txt

      - name: Save public IP address
        run: |
          awk '
            $1 == "address:" && $2 !~ /^10\./ {
              print $2
              exit
            }
          ' cache/vmconfig.txt > cache/addr

          test -s cache/addr || {
            echo "Public IP address was not found"
            cat cache/vmconfig.txt
            exit 1
          }

          echo "VM address: $(cat cache/addr)"

      - name: Wait for SSH
        run: |
          chmod 600 "$SSH_KEY"

          for attempt in $(seq 1 30); do
            if ssh \
              -i "$SSH_KEY" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 \
              -o BatchMode=yes \
              "yc-user@$(cat cache/addr)" \
              "echo SSH is ready"; then
              exit 0
            fi

            echo "SSH is not ready yet. Attempt: $attempt/30"
            sleep 10
          done

          echo "SSH did not become available"
          exit 1

      - name: Upload VM cache
        uses: actions/upload-artifact@v4
        with:
          name: new-vm-cache
          path: cache
          retention-days: 1

      - name: Copy Tomcat service file
        run: |
          scp \
            -i "$SSH_KEY" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            tomcat.service \
            "yc-user@$(cat cache/addr):"

      - name: Copy context.xml
        run: |
          scp \
            -i "$SSH_KEY" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            context.xml \
            "yc-user@$(cat cache/addr):"

      - name: Copy pg_hba.conf
        run: |
          scp \
            -i "$SSH_KEY" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            pg_hba.conf \
            "yc-user@$(cat cache/addr):"

      - name: Create download script
        env:
          LINK_PG: ${{ secrets.LINK_PG }}
          LINK_HELP: ${{ secrets.LINK_HELP }}
          LINK_WEB: ${{ secrets.LINK_WEB }}
          LINK_DUMP1: ${{ secrets.LINK_DUMP1 }}
          LINK_DUMP2: ${{ secrets.LINK_DUMP2 }}
          LINK_DUMP3: ${{ secrets.LINK_DUMP3 }}
        run: |
          printf '%s\n' \
            "#!/usr/bin/env bash" \
            "set -e" \
            "./dl-cloud-mail-ru.sh \"$LINK_PG\" postgresql-42.0.0.jar" \
            "./dl-cloud-mail-ru.sh \"$LINK_HELP\" prhelp.war" \
            "./dl-cloud-mail-ru.sh \"$LINK_WEB\" prweb.war" \
            "./dl-cloud-mail-ru.sh \"$LINK_DUMP1\" pega.001" \
            "./dl-cloud-mail-ru.sh \"$LINK_DUMP2\" pega.002" \
            "./dl-cloud-mail-ru.sh \"$LINK_DUMP3\" pega.crc" \
            "exit" \
            > download.sh

          chmod 700 download.sh

      - name: Run before.sh on VM
        run: |
          ssh \
            -i "$SSH_KEY" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -t -t \
            "yc-user@$(cat cache/addr)" \
            < before.sh

      - name: Check download helper on VM
        run: |
          ssh \
            -i "$SSH_KEY" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "yc-user@$(cat cache/addr)" \
            'find "$HOME" -name "dl-cloud-mail-ru.sh" -type f -print'

      - name: Run download script on VM
        run: |
          ssh \
            -i "$SSH_KEY" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -t -t \
            "yc-user@$(cat cache/addr)" \
            < download.sh

      - name: Install database on VM
        run: |
          ssh \
            -i "$SSH_KEY" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -t -t \
            "yc-user@$(cat cache/addr)" \
            < db-install.sh

      - name: Install Tomcat on VM
        run: |
          ssh \
            -i "$SSH_KEY" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -t -t \
            "yc-user@$(cat cache/addr)" \
            < tomcat-install.sh

      - name: Remove service account key
        if: always()
        run: |
          rm -f "$HOME/sa-key.json"
